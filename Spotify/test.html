<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Play Pause Toggle</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #play-btn {
      cursor: pointer;
      width: 50px;
      height: 50px;
    }

    #play-btn img {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Play/Pause Button -->
  <div id="play-btn" onclick="togglePlay()">
    <img id="icon" src="assets/play2-svgrepo-com.svg" alt="Play">
  </div>

  <!-- Audio -->
  <audio id="myAudio" src="assets\song\Police - Cheema Y.mp3"></audio>

  <script>
    const audio = document.getElementById("myAudio");
    const icon = document.getElementById("icon");

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        icon.src = "assets/pause-svgrepo-com.svg";
      } else {
        audio.pause();
        icon.src = "assets/play2-svgrepo-com.svg";
      }
    }
  </script>

</body>
</html>
