<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Individual Cards</title>
  <style>
    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 20px;
    }

    .card {
      background-color: #333;
      padding: 30px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .child {
      width: 80px;
      height: 80px;
      background-color: steelblue;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .child.hovered {
      background-color: crimson;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="child"></div>
  </div>

  <div class="card">
    <div class="child"></div>
  </div>

  <div class="card">
    <div class="child"></div>
  </div>

  <div class="card">
    <div class="child"></div>
  </div>

  <script>
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      const child = card.querySelector('.child');

      card.addEventListener('mouseenter', () => {
        child.classList.add('hovered');
      });

      card.addEventListener('mouseleave', () => {
        child.classList.remove('hovered');
      });
    });
  </script>

</body>
</html>
